name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify

  smoke:
    name: Tomcat + MySQL end-to-end
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL and the app on Tomcat
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
