# docker compose up --build, then open http://localhost:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leave_db
      MYSQL_USER: leave
      MYSQL_PASSWORD: ${LEAVE_DB_PASSWORD:-leave-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
      TZ: Asia/Kuala_Lumpur
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./src/main/resources/db/sample-data.sql:/docker-entrypoint-initdb.d/2-sample-data.sql:ro
      - leave-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-dev-password}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEAVE_DB_URL: jdbc:mysql://db:3306/leave_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur
      LEAVE_DB_USER: leave
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD:-leave-dev-password}
    ports:
      - "8080:8080"

volumes:
  leave-data:
